<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="fitBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="fitCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="fitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#fitBgGrad)" />

  <!-- Ambient glow spheres -->
  <circle cx="220" cy="180" r="170" fill="#10b981" opacity="0.14" filter="url(#fitGlow)" />
  <circle cx="980" cy="480" r="220" fill="#06b6d4" opacity="0.12" filter="url(#fitGlow)" />
  <circle cx="600" cy="320" r="150" fill="#6366f1" opacity="0.08" filter="url(#fitGlow)" />

  <!-- Grid overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Mobile Phone Mockup 1 (Center Left - Active Workout Screen) -->
  <g transform="translate(180, 50)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="340" height="580" rx="38" fill="#090d16" stroke="#334155" stroke-width="4" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.8))" />
    <!-- Dynamic Island -->
    <rect x="120" y="14" width="100" height="18" rx="9" fill="#030712" />
    <circle cx="205" cy="23" r="3.5" fill="#1e293b" />

    <!-- Screen Content -->
    <rect x="12" y="42" width="316" height="524" rx="28" fill="#0b0f19" />

    <!-- Workout Header -->
    <text x="32" y="76" fill="#10b981" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" letter-spacing="1">TREINO ATIVO • PUSH A</text>
    <text x="32" y="98" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="900">Peito, Ombros &amp; Tríceps 🏋️</text>
    <rect x="252" y="70" width="64" height="24" rx="12" fill="#1e293b" />
    <text x="284" y="86" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">38 min</text>

    <!-- Rest Timer Box -->
    <rect x="28" y="112" width="284" height="88" rx="18" fill="url(#fitCardGrad)" stroke="#334155" stroke-width="1" />
    <text x="44" y="136" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">DESCANSO ENTRE SÉRIES</text>
    <text x="44" y="172" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="34" font-weight="900" letter-spacing="-1">00:45</text>
    <rect x="200" y="142" width="96" height="34" rx="17" fill="#10b981" />
    <text x="248" y="164" fill="#042f1a" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="900" text-anchor="middle">+30s</text>

    <!-- Exercise 1 Card -->
    <rect x="28" y="210" width="284" height="150" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="42" y="234" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="900">1. Supino Reto com Barra</text>
    <text x="290" y="234" fill="#10b981" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="end">4 Séries</text>

    <!-- Set 1 Completed -->
    <rect x="40" y="248" width="260" height="28" rx="8" fill="#10b981" fill-opacity="0.15" />
    <text x="52" y="267" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">Série 1: 80 kg × 10 reps</text>
    <text x="286" y="267" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="900" text-anchor="end">✓</text>

    <!-- Set 2 Active -->
    <rect x="40" y="282" width="260" height="28" rx="8" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <text x="52" y="301" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800">Série 2: 85 kg × 8 reps</text>
    <text x="286" y="301" fill="#10b981" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" text-anchor="end">EM ANDAMENTO</text>

    <!-- Set 3 -->
    <rect x="40" y="316" width="260" height="28" rx="8" fill="#0f172a" />
    <text x="52" y="335" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="600">Série 3: 85 kg × 8 reps</text>
    <text x="286" y="335" fill="#64748b" font-family="Plus Jakarta Sans, sans-serif" font-size="11" text-anchor="end">Pendente</text>

    <!-- Exercise 2 Preview -->
    <rect x="28" y="370" width="284" height="60" rx="14" fill="#131d2e" stroke="#334155" stroke-width="1" />
    <text x="42" y="394" fill="#e2e8f0" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">2. Desenvolvimento com Halteres</text>
    <text x="42" y="414" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">3 Séries × 10 a 12 reps • Halteres 24kg</text>

    <!-- Finish Workout Button -->
    <rect x="28" y="442" width="284" height="48" rx="16" fill="url(#emeraldGrad)" />
    <text x="170" y="472" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="900" text-anchor="middle">🏁 Finalizar Treino (+120 XP)</text>

    <!-- Bottom Nav Mockup -->
    <rect x="24" y="508" width="292" height="46" rx="23" fill="#070b14" stroke="#1e293b" stroke-width="1" />
    <text x="60" y="536" font-size="16" text-anchor="middle">📊</text>
    <circle cx="115" cy="531" r="16" fill="#10b981" />
    <text x="115" y="537" font-size="16" text-anchor="middle">🏋️</text>
    <text x="170" y="536" font-size="16" text-anchor="middle">🗺️</text>
    <text x="225" y="536" font-size="16" text-anchor="middle">📈</text>
    <text x="280" y="536" font-size="16" text-anchor="middle">🏆</text>
  </g>

  <!-- Mobile Phone Mockup 2 (Center Right - Dashboard & Evolution) -->
  <g transform="translate(560, 50)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="340" height="580" rx="38" fill="#090d16" stroke="#334155" stroke-width="4" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.8))" />
    <!-- Dynamic Island -->
    <rect x="120" y="14" width="100" height="18" rx="9" fill="#030712" />
    <circle cx="205" cy="23" r="3.5" fill="#1e293b" />

    <!-- Screen Content Area -->
    <rect x="12" y="42" width="316" height="524" rx="28" fill="#0b0f19" />

    <!-- App Header & User Level -->
    <text x="32" y="74" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">AL STUDIO FITNESS</text>
    <text x="32" y="96" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="900">Evolução &amp; Nível ⚡</text>
    <!-- Level Badge -->
    <rect x="238" y="72" width="76" height="26" rx="13" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <text x="276" y="89" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Nível 5 • Ouro</text>

    <!-- Gamification & XP Bar Card -->
    <rect x="28" y="112" width="284" height="96" rx="18" fill="url(#fitCardGrad)" stroke="#334155" stroke-width="1" />
    <text x="44" y="136" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">PROGRESSO DO NÍVEL</text>
    <text x="44" y="162" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="20" font-weight="900">680 / 1.000 XP</text>
    <text x="280" y="162" fill="#10b981" font-family="Plus Jakarta Sans, sans-serif" font-size="16" font-weight="800" text-anchor="end">68%</text>

    <!-- Progress bar -->
    <rect x="44" y="174" width="252" height="8" rx="4" fill="#070b14" />
    <rect x="44" y="174" width="171" height="8" rx="4" fill="url(#emeraldGrad)" />
    <text x="44" y="196" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="700">🔥 Sequência ativa: 6 dias consecutivos!</text>

    <!-- Evolution Stats Mini Row -->
    <g transform="translate(28, 218)">
      <!-- Stat 1 -->
      <rect x="0" y="0" width="88" height="66" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="44" y="24" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PESO</text>
      <text x="44" y="44" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="900" text-anchor="middle">76.4 kg</text>
      <text x="44" y="58" fill="#10b981" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800" text-anchor="middle">-2.1 kg</text>

      <!-- Stat 2 -->
      <rect x="98" y="0" width="88" height="66" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="142" y="24" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle">BRAÇO</text>
      <text x="142" y="44" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="900" text-anchor="middle">38.5 cm</text>
      <text x="142" y="58" fill="#10b981" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800" text-anchor="middle">+1.5 cm</text>

      <!-- Stat 3 -->
      <rect x="196" y="0" width="88" height="66" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="240" y="24" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle">TREINOS</text>
      <text x="240" y="44" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="15" font-weight="900" text-anchor="middle">24 sessões</text>
      <text x="240" y="58" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800" text-anchor="middle">100% no alvo</text>
    </g>

    <!-- Daily Missions Card -->
    <text x="32" y="312" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800">Missões de Hoje</text>
    <text x="296" y="312" fill="#10b981" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="end">2/3 Concluídas</text>

    <!-- Mission 1 -->
    <rect x="28" y="324" width="284" height="40" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <circle cx="48" cy="344" r="9" fill="#10b981" />
    <text x="48" y="348" fill="#042f1a" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="900" text-anchor="middle">✓</text>
    <text x="68" y="348" fill="#f1f5f9" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">Realizar Treino de Hoje</text>
    <text x="296" y="348" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" text-anchor="end">+100 XP</text>

    <!-- Mission 2 -->
    <rect x="28" y="370" width="284" height="40" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <circle cx="48" cy="390" r="9" fill="#10b981" />
    <text x="48" y="394" fill="#042f1a" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="900" text-anchor="middle">✓</text>
    <text x="68" y="394" fill="#f1f5f9" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">Beber 3L de Água</text>
    <text x="296" y="394" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800" text-anchor="end">+40 XP</text>

    <!-- Mission 3 (Pending) -->
    <rect x="28" y="416" width="284" height="40" rx="12" fill="#131d2e" stroke="#334155" stroke-width="1" />
    <circle cx="48" cy="436" r="9" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="68" y="440" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">Registrar Pesagem Semanal</text>
    <text x="296" y="440" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700" text-anchor="end">+30 XP</text>

    <!-- Mini Progress Line Chart Area -->
    <rect x="28" y="464" width="284" height="38" rx="12" fill="#1e293b" />
    <text x="40" y="488" font-size="10" fill="#10b981" font-family="monospace">TREINOS: 🟢 🟢 🟢 🟢 🟢 🟢 ⚪ (6/7)</text>

    <!-- Phone Bottom Nav Bar -->
    <rect x="24" y="508" width="292" height="46" rx="23" fill="#070b14" stroke="#1e293b" stroke-width="1" />
    <circle cx="60" cy="531" r="16" fill="#10b981" />
    <text x="60" y="537" font-size="16" text-anchor="middle">📊</text>
    <text x="115" y="536" font-size="16" text-anchor="middle">🏋️</text>
    <text x="170" y="536" font-size="16" text-anchor="middle">🗺️</text>
    <text x="225" y="536" font-size="16" text-anchor="middle">📈</text>
    <text x="280" y="536" font-size="16" text-anchor="middle">🏆</text>
  </g>

  <!-- Right Floating Features Badge Box -->
  <g transform="translate(930, 90)">
    <!-- Badge 1: AL Studio Fitness -->
    <rect x="0" y="0" width="230" height="48" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="30" font-size="18">⚡</text>
    <text x="44" y="24" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800" letter-spacing="1">AL STUDIO TECH</text>
    <text x="44" y="39" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="900">AL Studio Fitness</text>

    <!-- Badge 2: 100% Offline -->
    <rect x="0" y="64" width="230" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="98" font-size="20">💾</text>
    <text x="48" y="92" fill="#10b981" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">IndexedDB Seguro</text>
    <text x="48" y="110" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">100% no seu aparelho</text>
    <text x="48" y="125" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Sem login &amp; Sem internet</text>

    <!-- Badge 3: Rotinas & Cargas -->
    <rect x="0" y="154" width="230" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="188" font-size="20">🏋️</text>
    <text x="48" y="182" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">Progressão de Cargas</text>
    <text x="48" y="200" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Push/Pull/Legs, ABC, Full Body</text>
    <text x="48" y="215" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Descanso com bipe sonoro</text>

    <!-- Badge 4: Medidas & Fotos -->
    <rect x="0" y="244" width="230" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="278" font-size="20">📈</text>
    <text x="48" y="272" fill="#f59e0b" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">Medidas &amp; Fotos</text>
    <text x="48" y="290" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Evolução física corporal</text>
    <text x="48" y="305" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Galeria privada antes/depois</text>

    <!-- Badge 5: Gamificação -->
    <rect x="0" y="334" width="230" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="368" font-size="20">🏆</text>
    <text x="48" y="362" fill="#a855f7" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">Níveis &amp; Gamificação</text>
    <text x="48" y="380" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Ganhe XP e suba de nível</text>
    <text x="48" y="395" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Medalhas e streaks diários</text>
  </g>
</svg>
