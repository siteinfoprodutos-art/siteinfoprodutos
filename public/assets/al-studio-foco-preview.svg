<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="focoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="45%" stop-color="#0c1224" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="focoCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Indigo - Violet - Cyan Gradients -->
    <linearGradient id="focoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="focoTimerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="focoEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="focoAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="focoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#focoBgGrad)" />

  <!-- Ambient background glow spheres (Young / Tech / Focus aesthetic) -->
  <circle cx="210" cy="170" r="190" fill="#6366f1" opacity="0.18" filter="url(#focoGlow)" />
  <circle cx="980" cy="510" r="230" fill="#06b6d4" opacity="0.14" filter="url(#focoGlow)" />
  <circle cx="620" cy="330" r="160" fill="#a855f7" opacity="0.11" filter="url(#focoGlow)" />

  <!-- Subtle Blueprint Tech Grid Overlay -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- ========================================== -->
  <!-- MOBILE PHONE 1: MODO FOCO & CRONÔMETRO -->
  <!-- ========================================== -->
  <g transform="translate(180, 50)" filter="url(#phoneShadow)">
    <!-- Phone Outer Body Frame -->
    <rect x="0" y="0" width="340" height="580" rx="40" fill="#080d18" stroke="#334155" stroke-width="3.5" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="115" y="14" width="110" height="20" rx="10" fill="#020617" />
    <circle cx="210" cy="24" r="3.5" fill="#1e293b" />

    <!-- Screen Content Area -->
    <rect x="12" y="42" width="316" height="524" rx="30" fill="#0b1120" />

    <!-- App Header inside Phone -->
    <text x="32" y="74" fill="#818cf8" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="800" letter-spacing="1">AL STUDIO FOCO • ESTUDANTES</text>
    <text x="32" y="96" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="17" font-weight="900">Modo Foco ⏱️</text>
    
    <!-- Time Mode Pill (Top Right) -->
    <rect x="246" y="68" width="70" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="281" y="84" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" text-anchor="middle">25 min</text>

    <!-- Active Subject Badge -->
    <rect x="32" y="114" width="145" height="26" rx="13" fill="#6366f1" fill-opacity="0.22" stroke="#6366f1" stroke-width="1" />
    <text x="104" y="131" fill="#c7d2fe" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📐 Matemática - Álgebra</text>

    <!-- Big Circular Focus Timer Visual -->
