    <circle cx="170" cy="248" r="92" fill="none" stroke="url(#focoTimerGrad)" stroke-width="12" stroke-dasharray="578" stroke-dashoffset="145" stroke-linecap="round" transform="rotate(-90 170 248)" />

    <!-- Timer Digits & Status -->
    <text x="170" y="244" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-1.5">24:18</text>
    <text x="170" y="272" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1.5">SESSÃO ATIVA ⚡</text>

    <!-- Quick Preset Buttons (15m, 25m, 45m, 60m) -->
    <g transform="translate(32, 350)">
      <rect x="0" y="0" width="58" height="26" rx="13" fill="#1e293b" />
      <text x="29" y="17" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">15 min</text>

      <rect x="66" y="0" width="62" height="26" rx="13" fill="#6366f1" />
      <text x="97" y="17" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">25 min</text>

      <rect x="136" y="0" width="58" height="26" rx="13" fill="#1e293b" />
      <text x="165" y="17" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">45 min</text>

      <rect x="202" y="0" width="74" height="26" rx="13" fill="#1e293b" />
      <text x="239" y="17" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">60 min</text>
    </g>

    <!-- Main Action Buttons (Pausar / Concluir) -->
    <g transform="translate(32, 390)">
      <rect x="0" y="0" width="130" height="42" rx="21" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="65" y="26" fill="#f8fafc" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800" text-anchor="middle">⏸️ Pausar</text>

      <rect x="146" y="0" width="130" height="42" rx="21" fill="url(#focoEmeraldGrad)" />
      <text x="211" y="26" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="900" text-anchor="middle">✓ Concluir (+50 XP)</text>
    </g>

    <!-- Streak & Consistency Banner -->
    <rect x="28" y="446" width="284" height="50" rx="16" fill="url(#focoCardGrad)" stroke="#334155" stroke-width="1" />
    <text x="46" y="476" font-size="20">🔥</text>
    <text x="76" y="468" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="800">Sequência: 7 dias seguidos!</text>
    <text x="76" y="485" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600">Meta diária quase completa (85%)</text>

    <!-- Phone Bottom Navigation Bar -->
    <rect x="24" y="508" width="292" height="46" rx="23" fill="#070c18" stroke="#1e293b" stroke-width="1" />
    <text x="58" y="536" font-size="15" text-anchor="middle">🏠</text>
    <text x="114" y="536" font-size="15" text-anchor="middle">✅</text>
    <circle cx="170" cy="531" r="16" fill="#6366f1" />
    <text x="170" y="537" font-size="15" text-anchor="middle">⏱️</text>
    <text x="226" y="536" font-size="15" text-anchor="middle">📅</text>
    <text x="282" y="536" font-size="15" text-anchor="middle">📊</text>
  </g>

  <!-- ========================================== -->
