    <!-- Task Item 1 (Done) -->
    <rect x="28" y="298" width="284" height="40" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <circle cx="48" cy="318" r="8" fill="#10b981" />
    <text x="48" y="322" fill="#042f1a" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="900" text-anchor="middle">✓</text>
    <text x="66" y="322" fill="#e2e8f0" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700">Resumo de Biologia: Genética</text>
    <rect x="236" y="308" width="64" height="20" rx="10" fill="#10b981" fill-opacity="0.2" />
    <text x="268" y="322" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Biologia</text>

    <!-- Task Item 2 (Pending) -->
    <rect x="28" y="346" width="284" height="40" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
