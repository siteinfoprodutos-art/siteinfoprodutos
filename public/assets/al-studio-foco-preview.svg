<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Ambient background glow spheres -->
  <circle cx="200" cy="180" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="1000" cy="500" r="200" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="300" r="140" fill="#a855f7" opacity="0.1" filter="url(#glow)" />

  <!-- Grid overlay lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Mobile Phone Mockup 1 (Center Left - Timer Screen) -->
  <g transform="translate(180, 50)">
    <!-- Phone Body Outer Frame -->
    <rect x="0" y="0" width="340" height="580" rx="38" fill="#0b0f19" stroke="#334155" stroke-width="4" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.7))" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="120" y="14" width="100" height="18" rx="9" fill="#030712" />
    <circle cx="205" cy="23" r="3.5" fill="#1e293b" />

    <!-- Screen Content Area -->
    <rect x="12" y="42" width="316" height="524" rx="28" fill="#0f172a" />

    <!-- App Header inside Phone -->
    <text x="32" y="76" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" letter-spacing="1">AL STUDIO FOCO</text>
    <text x="32" y="98" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800">Modo Foco ⏱️</text>
    <rect x="256" y="70" width="60" height="24" rx="12" fill="#1e293b" />
    <text x="286" y="86" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">25 min</text>

    <!-- Subject Pill -->
    <rect x="32" y="118" width="130" height="26" rx="13" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
    <text x="97" y="135" fill="#a5b4fc" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📐 Matemática</text>

    <!-- Big Timer Circle -->
    <circle cx="170" cy="260" r="95" fill="none" stroke="#1e293b" stroke-width="12" />
    <circle cx="170" cy="260" r="95" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="596" stroke-dashoffset="150" stroke-linecap="round" transform="rotate(-90 170 260)" />

    <!-- Timer Digits -->
    <text x="170" y="255" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-1">24:18</text>
    <text x="170" y="285" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">FOCO ATIVO</text>

    <!-- Timer Control Buttons -->
    <rect x="52" y="380" width="110" height="42" rx="21" fill="#6366f1" />
    <text x="107" y="406" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" text-anchor="middle">⏸️ Pausar</text>

    <rect x="178" y="380" width="110" height="42" rx="21" fill="#10b981" />
    <text x="233" y="406" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800" text-anchor="middle">✓ Concluir</text>

    <!-- Streak Mini Banner -->
    <rect x="32" y="442" width="276" height="52" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="50" y="472" font-size="20">🔥</text>
    <text x="80" y="465" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">Sequência: 5 dias</text>
    <text x="80" y="482" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Você está mantendo o ritmo diário!</text>

    <!-- Phone Bottom Nav Bar -->
    <rect x="24" y="508" width="292" height="46" rx="23" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="60" y="536" font-size="16" text-anchor="middle">🏠</text>
    <text x="115" y="536" font-size="16" text-anchor="middle">✅</text>
    <circle cx="170" cy="531" r="16" fill="#6366f1" />
    <text x="170" y="537" font-size="16" text-anchor="middle">⏱️</text>
    <text x="225" y="536" font-size="16" text-anchor="middle">📅</text>
    <text x="280" y="536" font-size="16" text-anchor="middle">📊</text>
  </g>

  <!-- Mobile Phone Mockup 2 (Center Right - Dashboard "Meu Dia") -->
  <g transform="translate(560, 50)">
    <!-- Phone Body Outer Frame -->
    <rect x="0" y="0" width="340" height="580" rx="38" fill="#0b0f19" stroke="#334155" stroke-width="4" filter="drop-shadow(0 25px 50px rgba(0,0,0,0.7))" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="120" y="14" width="100" height="18" rx="9" fill="#030712" />
    <circle cx="205" cy="23" r="3.5" fill="#1e293b" />

    <!-- Screen Content Area -->
    <rect x="12" y="42" width="316" height="524" rx="28" fill="#0f172a" />

    <!-- App Header & Greeting -->
    <text x="32" y="74" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">QUINTA-FEIRA, 27 DE AGOSTO</text>
    <text x="32" y="96" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="900">Meu Dia 🚀</text>
    <!-- Avatar -->
    <circle cx="295" cy="85" r="16" fill="#6366f1" />
    <text x="295" y="91" font-size="15" text-anchor="middle">⚡</text>

    <!-- Daily Progress Card -->
    <rect x="28" y="112" width="284" height="96" rx="18" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <text x="44" y="136" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">META DE HOJE</text>
    <text x="44" y="162" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="900">42 / 60 min</text>
    <text x="280" y="162" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="800" text-anchor="end">70%</text>

    <!-- Progress bar -->
    <rect x="44" y="174" width="252" height="8" rx="4" fill="#090d16" />
    <rect x="44" y="174" width="176" height="8" rx="4" fill="url(#accentGrad)" />
    <text x="44" y="196" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="600">Você está indo bem! Continue assim.</text>

    <!-- Big CTA Button -->
    <rect x="28" y="218" width="284" height="44" rx="16" fill="url(#accentGrad)" />
    <text x="170" y="246" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="800" text-anchor="middle">🎯 Começar foco</text>

    <!-- Today's Tasks Summary -->
    <text x="32" y="286" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="800">Tarefas de Hoje</text>
    <text x="296" y="286" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="end">3 pendentes</text>

    <!-- Task Item 1 -->
    <rect x="28" y="298" width="284" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="48" cy="319" r="8" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="66" y="323" fill="#f1f5f9" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">Revisar fórmulas de Física</text>
    <rect x="238" y="308" width="62" height="20" rx="10" fill="#3b82f6" fill-opacity="0.2" />
    <text x="269" y="322" fill="#60a5fa" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Ciências</text>

    <!-- Task Item 2 -->
    <rect x="28" y="348" width="284" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="48" cy="369" r="8" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="66" y="373" fill="#f1f5f9" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700">Resumo de História cap. 4</text>
    <rect x="238" y="358" width="62" height="20" rx="10" fill="#eab308" fill-opacity="0.2" />
    <text x="269" y="372" fill="#facc15" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" text-anchor="middle">História</text>

    <!-- Next Event / Exam Banner -->
    <rect x="28" y="400" width="284" height="52" rx="14" fill="#dc2626" fill-opacity="0.15" stroke="#ef4444" stroke-width="1" />
    <text x="44" y="424" font-size="16">📝</text>
    <text x="68" y="420" fill="#fca5a5" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="800">PROVA AMANHÃ</text>
    <text x="68" y="438" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">Prova de Matemática - 08:00</text>

    <!-- Mini Weekly Bar Chart -->
    <rect x="28" y="460" width="284" height="42" rx="12" fill="#1e293b" />
    <text x="40" y="485" font-size="10" fill="#94a3b8" font-family="monospace">SEG ███  TER █████  QUA ██  QUI ████</text>

    <!-- Phone Bottom Nav Bar -->
    <rect x="24" y="508" width="292" height="46" rx="23" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <circle cx="60" cy="531" r="16" fill="#6366f1" />
    <text x="60" y="537" font-size="16" text-anchor="middle">🏠</text>
    <text x="115" y="536" font-size="16" text-anchor="middle">✅</text>
    <text x="170" y="536" font-size="16" text-anchor="middle">⏱️</text>
    <text x="225" y="536" font-size="16" text-anchor="middle">📅</text>
    <text x="280" y="536" font-size="16" text-anchor="middle">📊</text>
  </g>

  <!-- Right Floating Features Badge Box -->
  <g transform="translate(930, 90)">
    <!-- Badge 1: AL Studio Jovem -->
    <rect x="0" y="0" width="230" height="48" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="30" font-size="18">⚡</text>
    <text x="44" y="24" fill="#a5b4fc" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800" letter-spacing="1">LINHA EXCLUSIVA</text>
    <text x="44" y="39" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="900">AL Studio Jovem</text>

    <!-- Badge 2: 100% Offline -->
    <rect x="0" y="64" width="230" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="98" font-size="20">💾</text>
    <text x="48" y="92" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">IndexedDB Seguro</text>
    <text x="48" y="110" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">100% no seu dispositivo</text>
    <text x="48" y="125" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Sem login &amp; Sem internet</text>

    <!-- Badge 3: Pomodoro & Metas -->
    <rect x="0" y="154" width="230" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="188" font-size="20">🎯</text>
    <text x="48" y="182" fill="#34d399" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">Temporizador &amp; Metas</text>
    <text x="48" y="200" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">15, 25, 30, 45, 60 min</text>
    <text x="48" y="215" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Controle diário e semanal</text>

    <!-- Badge 4: Calendário de Provas -->
    <rect x="0" y="244" width="230" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="278" font-size="20">📅</text>
    <text x="48" y="272" fill="#f59e0b" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">Provas &amp; Trabalhos</text>
    <text x="48" y="290" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Planejamento visual</text>
    <text x="48" y="305" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Alertas de prazos</text>

    <!-- Badge 5: Mobile First & PWA -->
    <rect x="0" y="334" width="230" height="74" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="16" y="368" font-size="20">📱</text>
    <text x="48" y="362" fill="#a855f7" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="800">Mobile First &amp; PWA</text>
    <text x="48" y="380" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Instale no celular</text>
    <text x="48" y="395" fill="#94a3b8" font-family="Plus Jakarta Sans, sans-serif" font-size="10">Visual moderno &amp; ágil</text>
  </g>
</svg>
