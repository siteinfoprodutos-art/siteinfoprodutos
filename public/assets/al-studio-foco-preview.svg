    <text x="66" y="370" fill="#f8fafc" font-family="Plus Jakarta Sans, sans-serif" font-size="10.5" font-weight="700">Lista de Exercícios: Trigonometria</text>
    <rect x="236" y="356" width="64" height="20" rx="10" fill="#6366f1" fill-opacity="0.2" />
    <text x="268" y="370" fill="#a5b4fc" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Matemática</text>

    <!-- Exam / Deadline Alert Card -->
    <rect x="28" y="394" width="284" height="52" rx="14" fill="#dc2626" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.2" />
    <text x="44" y="420" font-size="17">📅</text>
    <text x="70" y="416" fill="#fca5a5" font-family="Plus Jakarta Sans, sans-serif" font-size="9.5" font-weight="800">PROVA AMANHÃ • IMPORTANTE</text>
    <text x="70" y="434" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="11.5" font-weight="800">Prova de Física II (Leis de Newton) • 08h</text>

    <!-- Weekly Study Stats Bar Line -->
    <rect x="28" y="456" width="284" height="42" rx="12" fill="#1e293b" />
    <text x="40" y="481" font-size="10" fill="#38bdf8" font-family="monospace">SEG 45m  TER 60m  QUA 50m  QUI 45m 🟢</text>

    <!-- Phone Bottom Navigation Bar -->
    <rect x="24" y="508" width="292" height="46" rx="23" fill="#070c18" stroke="#1e293b" stroke-width="1" />
    <circle cx="58" cy="531" r="16" fill="#6366f1" />
    <text x="58" y="537" font-size="15" text-anchor="middle">🏠</text>
    <text x="114" y="536" font-size="15" text-anchor="middle">✅</text>
    <text x="170" y="536" font-size="15" text-anchor="middle">⏱️</text>
    <text x="226" y="536" font-size="15" text-anchor="middle">📅</text>
    <text x="282" y="536" font-size="15" text-anchor="middle">📊</text>
