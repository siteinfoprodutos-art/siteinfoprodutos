    <text x="44" y="162" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="22" font-weight="900">45 / 60 min</text>
    <text x="280" y="162" fill="#38bdf8" font-family="Plus Jakarta Sans, sans-serif" font-size="17" font-weight="800" text-anchor="end">75%</text>

    <!-- Progress bar -->
