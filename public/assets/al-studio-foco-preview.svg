  <!-- ========================================== -->
  <!-- RIGHT FLOATING FEATURES & CATEGORY BADGES  -->
  <!-- ========================================== -->
  <g transform="translate(930, 85)">
    <!-- Badge 1: AL Studio Estudantes Header -->
    <rect x="0" y="0" width="230" height="50" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="16" y="32" font-size="19">🎓</text>
    <text x="46" y="24" fill="#a5b4fc" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="800" letter-spacing="1">AL STUDIO ESTUDANTES</text>
    <text x="46" y="40" fill="#ffffff" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="900">AL Studio Foco</text>

    <!-- Badge 2: 100% Offline & Seguro -->
