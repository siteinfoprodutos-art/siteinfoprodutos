<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="curriculo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    
    <linearGradient id="navy-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="purple-btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <filter id="shadow-soft" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Canvas Outer Background -->
  <rect width="1200" height="675" rx="16" fill="url(#curriculo-bg)"/>

  <!-- APP HEADER BAR -->
  <g transform="translate(0, 0)">
    <rect width="1200" height="56" fill="#ffffff" />
    <line x1="0" y1="56" x2="1200" y2="56" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Logo AL StudioTech -->
    <rect x="24" y="12" width="32" height="32" rx="8" fill="#6366f1"/>
    <text x="40" y="33" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" text-anchor="middle">AL</text>
    
    <text x="68" y="27" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13">AL StudioTech</text>
    <text x="68" y="41" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11">Gerador de Currículo</text>

    <!-- Header Right Action -->
    <text x="1176" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" text-anchor="end">Pular configuração</text>
  </g>

  <!-- MAIN TWO-COLUMN CONTAINER -->
  <!-- LEFT COLUMN: WIZARD FORM -->
  <g transform="translate(48, 80)">
    <!-- Main Form White Card -->
    <rect x="0" y="0" width="560" height="550" rx="20" fill="#ffffff" filter="url(#shadow-soft)" border="1" stroke="#e2e8f0"/>

    <!-- Progress Bar Section -->
    <text x="32" y="36" fill="#6366f1" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="0.5">PASSO 1 DE 5</text>
    <text x="528" y="36" fill="#6366f1" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="end">20%</text>

    <rect x="32" y="46" width="496" height="6" rx="3" fill="#f1f5f9"/>
    <rect x="32" y="46" width="100" height="6" rx="3" fill="#6366f1"/>

    <!-- Title & Subtitle -->
    <text x="32" y="80" fill="#6366f1" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" letter-spacing="1">PASSO 1 DE 5 • SEU MOMENTO</text>
    <text x="32" y="112" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22">O que você está procurando?</text>
    <text x="32" y="134" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13">Selecione a opção que melhor descreve seu objetivo atual:</text>

    <!-- 2-COLUMN GRID OF CARDS -->
    <!-- ROW 1 -->
    <!-- Card 1: Emprego (Selected) -->
    <g transform="translate(32, 156)">
      <rect x="0" y="0" width="238" height="84" rx="14" fill="#f5f3ff" stroke="#6366f1" stroke-width="2"/>
      <rect x="12" y="20" width="44" height="44" rx="10" fill="#6366f1"/>
      <!-- Briefcase Icon -->
      <path d="M26 36H42M28 36V32C28 30.8954 28.8954 30 30 30H38C39.1046 30 40 30.8954 40 32V36M26 36V46C26 47.1046 26.8954 48 28 48H42C43.1046 48 44 47.1046 44 46V36" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      
      <text x="66" y="38" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13">Emprego</text>
      <text x="66" y="54" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11">Buscar novas...</text>

      <!-- Selected Checkmark Circle -->
      <circle cx="216" cy="42" r="10" fill="#6366f1"/>
      <path d="M211 42L214.5 45.5L221 38.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Card 2: Primeiro Emprego -->
    <g transform="translate(290, 156)">
