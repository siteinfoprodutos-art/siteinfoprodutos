            <text x="36" y="145" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Seg</text>

            <rect x="80" y="50" width="28" height="80" rx="4" fill="#60a5fa"/>
            <text x="86" y="145" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Ter</text>

            <rect x="130" y="30" width="28" height="100" rx="4" fill="#3b82f6"/>
            <text x="136" y="145" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Qua</text>

            <rect x="180" y="60" width="28" height="70" rx="4" fill="#60a5fa"/>
            <text x="186" y="145" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Qui</text>

            <rect x="230" y="20" width="28" height="110" rx="4" fill="#2563eb"/>
            <text x="238" y="145" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Sex</text>

            <rect x="280" y="10" width="28" height="120" rx="4" fill="#1d4ed8"/>
            <text x="286" y="145" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Sáb</text>
          </g>

          <!-- Quick Actions / Highlights -->
