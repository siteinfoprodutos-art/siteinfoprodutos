            <text x="20" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14">Kit Pequeno Negócio</text>
            <text x="20" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11">Solução pronta de gestão comercial</text>

            <line x1="20" y1="68" x2="326" y2="68" stroke="#1e293b" stroke-width="1"/>

            <text x="20" y="94" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">✓ 8 Ferramentas Integradas</text>
            <text x="20" y="116" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">✓ Interface Limpa &amp; Responsiva</text>
            <text x="20" y="138" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">✓ Pagamento Único sem Assinatura</text>

            <rect x="20" y="156" width="306" height="42" rx="8" fill="#2563eb"/>
            <text x="100" y="182" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13">QUERO MEU KIT</text>
