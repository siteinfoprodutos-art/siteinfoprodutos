        <text x="592" y="28" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12">💰 Controle de Caixa</text>
        <text x="592" y="58" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22">R$ 5.420,00</text>
