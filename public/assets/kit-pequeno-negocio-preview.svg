<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <filter id="shadow-soft-kit" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="shadow-card-kit" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="675" rx="16" fill="url(#kit-bg)"/>

  <!-- APP CONTAINER -->
  <g transform="translate(12, 12)">
    <!-- App Window Outer Frame -->
    <rect width="1176" height="651" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-soft-kit)"/>

    <!-- 1. TOP HEADER BAR -->
    <rect x="0" y="0" width="1176" height="52" rx="14" fill="#ffffff"/>
    <line x1="0" y1="52" x2="1176" y2="52" stroke="#e2e8f0" stroke-width="1"/>

    <!-- App Logo & Name -->
    <g transform="translate(20, 14)">
      <rect width="24" height="24" rx="6" fill="#2563eb"/>
      <path d="M7 12L10 15L17 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="17" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14">AL Studio Tech</text>
      <text x="140" y="17" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13">• Kit Pequeno Negócio</text>
