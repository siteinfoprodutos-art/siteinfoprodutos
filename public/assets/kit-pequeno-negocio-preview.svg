        <text x="16" y="28" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12">📊 Controle de Vendas</text>
        <text x="16" y="58" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22">R$ 14.850,00</text>
        <rect x="180" y="18" width="74" height="22" rx="11" fill="#eff6ff"/>
        <text x="190" y="33" fill="#2563eb" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10">+18% mês</text>

        <!-- Card 2: Estoque -->
        <rect x="288" y="0" width="270" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow-card-kit)"/>
        <text x="304" y="28" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12">📦 Controle de Estoque</text>
        <text x="304" y="58" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22">342 itens</text>
