          <text x="16" y="50" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11">Controle de Vendas • Clientes • Estoque • Caixa • Despesas • Metas • Dashboard • Precificação</text>
