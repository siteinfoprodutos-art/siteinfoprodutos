<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light theme background -->
    <linearGradient id="gestao-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <filter id="shadow-soft-gestao" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="shadow-card-gestao" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="675" rx="16" fill="url(#gestao-bg)"/>

  <!-- APP CONTAINER -->
  <g transform="translate(12, 12)">
    <!-- App Window Outer Frame -->
    <rect width="1176" height="651" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-soft-gestao)"/>

    <!-- 1. TOP HEADER BAR -->
    <rect x="0" y="0" width="1176" height="52" rx="14" fill="#ffffff"/>
    <line x1="0" y1="52" x2="1176" y2="52" stroke="#e2e8f0" stroke-width="1"/>

    <!-- App Logo & Name -->
    <rect x="16" y="10" width="32" height="32" rx="10" fill="#22c55e"/>
    <!-- Store Icon -->
    <path d="M24 28V20H40V28M22 28H42V32H22V28Z" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <text x="56" y="26" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14">Padaria Monte e Verde</text>
    
    <!-- Tag Badges -->
    <rect x="210" y="14" width="125" height="20" rx="6" fill="#f1f5f9"/>
    <text x="272" y="28" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" text-anchor="middle">PADARIA &amp; CONFEITARIA</text>

    <text x="56" y="42" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10">Organize seu negócio de forma simples.</text>

    <!-- Header Actions (Right Icons) -->
    <rect x="1050" y="12" width="28" height="28" rx="8" fill="#f1f5f9"/>
    <text x="1064" y="30" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">✨</text>

    <rect x="1086" y="12" width="28" height="28" rx="8" fill="#dcfce7"/>
    <text x="1100" y="30" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">🧪</text>

    <rect x="1122" y="12" width="28" height="28" rx="8" fill="#f1f5f9"/>
    <text x="1136" y="30" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">🌙</text>

    <!-- 2. LEFT SIDEBAR MENU -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="210" height="599" fill="#ffffff"/>
      <line x1="210" y1="0" x2="210" y2="599" stroke="#e2e8f0" stroke-width="1"/>

      <text x="16" y="24" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" letter-spacing="0.5">MENU PRINCIPAL</text>

      <!-- Active MenuItem: Dashboard (Red) -->
      <rect x="12" y="34" width="186" height="38" rx="10" fill="#dc2626"/>
      <!-- Grid icon -->
      <rect x="24" y="46" width="6" height="6" fill="#ffffff" rx="1"/>
      <rect x="32" y="46" width="6" height="6" fill="#ffffff" rx="1"/>
      <rect x="24" y="54" width="6" height="6" fill="#ffffff" rx="1"/>
      <rect x="32" y="54" width="6" height="6" fill="#ffffff" rx="1"/>
      <text x="46" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12">Dashboard</text>

      <!-- MenuItem 2: Itens & Fornadas -->
      <text x="24" y="98" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">🏷️  Itens &amp; Fornadas</text>

      <!-- MenuItem 3: Clientes -->
      <text x="24" y="132" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">👥  Clientes</text>

      <!-- MenuItem 4: Estoque de Farinhas & Insumos -->
      <text x="24" y="166" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11.5">📦  Estoque de Farinhas...</text>
      <circle cx="180" cy="162" r="9" fill="#f59e0b"/>
      <text x="180" y="165" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" text-anchor="middle">2</text>

      <!-- MenuItem 5: Financeiro -->
      <text x="24" y="200" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">💲  Financeiro</text>

      <!-- MenuItem 6: Relatórios -->
      <text x="24" y="234" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">📊  Relatórios</text>

      <!-- MenuItem 7: Configurações -->
      <text x="24" y="268" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">⚙️  Configurações</text>

      <!-- MenuItem 8: Backup -->
      <text x="24" y="302" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12">💾  Backup</text>

      <!-- Sidebar Bottom Alert Card -->
      <g transform="translate(12, 330)">
        <rect x="0" y="0" width="186" height="74" rx="10" fill="#fef3c7" stroke="#fde68a"/>
        <text x="12" y="20" fill="#b45309" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10">⚠️ Alerta de Estoque</text>
        <text x="12" y="36" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="9.5">2 itens atingiram o estoque mínimo.</text>
        <text x="12" y="56" fill="#d97706" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10">Ver estoque →</text>
      </g>

      <!-- Sidebar Action Buttons -->
      <g transform="translate(12, 416)">
        <rect x="0" y="0" width="186" height="30" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="93" y="19" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" text-anchor="middle">📥 Instalar Aplicativo</text>

        <rect x="0" y="36" width="186" height="26" rx="8" fill="#f1f5f9"/>
        <text x="12" y="53" fill="#16a34a" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9">● Testes PWA &amp; Offline</text>

        <rect x="0" y="68" width="186" height="26" rx="8" fill="#fef2f2"/>
        <text x="12" y="85" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="9">✨ Assistente Inicial</text>

        <text x="12" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">AL Studio Gestão</text>
        <text x="174" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="end">v2.0 PWA</text>
      </g>
    </g>

    <!-- 3. MAIN DASHBOARD CONTENT (RIGHT AREA) -->
    <g transform="translate(230, 68)">
      <!-- Title & Action Bar -->
      <text x="0" y="24" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24">Painel Gerencial</text>
      <text x="0" y="44" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12">Visão estratégica e resultados em tempo real</text>

      <!-- Right Action Pills -->
      <rect x="610" y="8" width="90" height="28" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="655" y="26" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" text-anchor="middle">📊 Ver relatório</text>

      <rect x="708" y="8" width="112" height="28" rx="8" fill="#fef3c7" stroke="#fde68a"/>
      <text x="764" y="26" fill="#d97706" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" text-anchor="middle">📈 Comparar período</text>

      <rect x="828" y="8" width="96" height="28" rx="8" fill="#dcfce7" stroke="#bbf7d0"/>
      <text x="876" y="26" fill="#15803d" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" text-anchor="middle">📥 Exportar mês</text>

      <!-- 6 METRICS CARDS ROW -->
      <g transform="translate(0, 60)">
        <!-- Card 1: Faturamento -->
        <g transform="translate(0, 0)">
          <rect width="146" height="88" rx="12" fill="#ffffff" filter="url(#shadow-card-gestao)" stroke="#e2e8f0"/>
          <text x="12" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" letter-spacing="0.3">FATURAMENTO (HOJE)</text>
          <text x="130" y="22" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" text-anchor="end">$</text>
          <text x="12" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">R$ 0,00</text>
          <text x="12" y="70" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5">↘ 100.0% vs Ontem</text>
        </g>

        <!-- Card 2: Vendas -->
        <g transform="translate(154, 0)">
          <rect width="146" height="88" rx="12" fill="#ffffff" filter="url(#shadow-card-gestao)" stroke="#e2e8f0"/>
          <text x="12" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" letter-spacing="0.3">VENDAS (HOJE)</text>
          <text x="130" y="22" fill="#3b82f6" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="end">🛍️</text>
          <text x="12" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">0</text>
          <text x="12" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5">Sem dados p/ comparar</text>
        </g>

        <!-- Card 3: Ticket Médio -->
        <g transform="translate(308, 0)">
          <rect width="146" height="88" rx="12" fill="#ffffff" filter="url(#shadow-card-gestao)" stroke="#e2e8f0"/>
          <text x="12" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" letter-spacing="0.3">TICKET MÉDIO</text>
          <text x="130" y="22" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="end">💳</text>
          <text x="12" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">R$ 0,00</text>
          <text x="12" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8.5">Sem dados p/ comparar</text>
        </g>

        <!-- Card 4: Custos Est. -->
        <g transform="translate(462, 0)">
          <rect width="146" height="88" rx="12" fill="#ffffff" filter="url(#shadow-card-gestao)" stroke="#e2e8f0"/>
          <text x="12" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" letter-spacing="0.3">CUSTOS EST. (HOJE)</text>
          <text x="130" y="22" fill="#f97316" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="end">🎯</text>
          <text x="12" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">R$ 0,00</text>
          <text x="12" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8">Custo unit. dos produtos</text>
        </g>

        <!-- Card 5: Lucro Est. -->
        <g transform="translate(616, 0)">
          <rect width="146" height="88" rx="12" fill="#ffffff" filter="url(#shadow-card-gestao)" stroke="#e2e8f0"/>
          <text x="12" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" letter-spacing="0.3">LUCRO EST. (HOJE)</text>
          <text x="130" y="22" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="end">📈</text>
          <text x="12" y="52" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">R$ 0,00</text>
          <text x="12" y="70" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8.5">↘ 100.0% vs Ontem</text>
        </g>

        <!-- Card 6: Margem -->
        <g transform="translate(770, 0)">
          <rect width="154" height="88" rx="12" fill="#ffffff" filter="url(#shadow-card-gestao)" stroke="#e2e8f0"/>
          <text x="12" y="22" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="8.5" letter-spacing="0.3">MARGEM (HOJE)</text>
          <text x="138" y="22" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="end">⏱️</text>
          <text x="12" y="52" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18">0.0%</text>
          <text x="12" y="70" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="8">Margem sobre faturamento</text>
        </g>
      </g>

      <!-- LOWER AREA: ALERTS & CHARTS -->
      <g transform="translate(0, 164)">
        <!-- LEFT COLUMN: Alert Box + Insights -->
        <g transform="translate(0, 0)">
          <!-- Alert Box -->
          <rect width="360" height="74" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
          <text x="16" y="24" fill="#b91c1c" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12">⚠️  Estoque de Farinhas &amp; Insumos Baixo</text>
          <text x="16" y="46" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="11">2 itens precisam de reposição imediata.</text>

          <!-- Insights Card -->
          <g transform="translate(0, 90)">
            <rect width="360" height="130" rx="14" fill="#ffffff" filter="url(#shadow-card-gestao)" stroke="#e2e8f0"/>
            <text x="16" y="28" fill="#9333ea" font-family="system-ui, -apple-system, sans-serif" font-size="12">✨</text>
            <text x="36" y="28" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" letter-spacing="0.5">INSIGHTS BASEADOS EM DADOS</text>

            <circle cx="20" cy="56" r="3" fill="#16a34a"/>
            <text x="32" y="60" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11">Caixas de Pizza Oitavadas 35cm está</text>
            <text x="32" y="76" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11">próximo ou abaixo do estoque mínimo</text>
            <text x="32" y="92" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11">definido.</text>
          </g>
        </g>

        <!-- RIGHT COLUMN: BAR CHART "Desempenho Diário" -->
        <g transform="translate(380, 0)">
          <rect width="544" height="220" rx="16" fill="#ffffff" filter="url(#shadow-card-gestao)" stroke="#e2e8f0"/>

          <!-- Chart Title & Legend -->
          <text x="20" y="28" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13">Desempenho Diário (Últimos 7 dias)</text>

          <circle cx="430" cy="24" r="4" fill="#10b981"/>
          <text x="440" y="28" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10">Faturamento</text>

          <circle cx="500" cy="24" r="4" fill="#ef4444"/>
          <text x="510" y="28" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="10">Despesas</text>

          <!-- Y Axis ticks -->
          <text x="20" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">R$ 600</text>
          <text x="20" y="95" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">R$ 450</text>
          <text x="20" y="130" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">R$ 300</text>
          <text x="20" y="165" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">R$ 150</text>
          <text x="20" y="195" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">R$ 0</text>

          <!-- Bars -->
          <!-- Seg: Red bar -->
          <rect x="290" y="120" width="22" height="70" rx="3" fill="#ef4444"/>
          <!-- Ter: Red bar -->
          <rect x="350" y="140" width="22" height="50" rx="3" fill="#ef4444"/>
          <!-- Qui: Green bar -->
          <rect x="470" y="90" width="22" height="100" rx="3" fill="#10b981"/>

          <!-- X Axis Days Labels -->
          <text x="120" y="198" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">sáb.</text>
          <text x="180" y="198" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">dom.</text>
          <text x="240" y="198" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">seg.</text>
          <text x="300" y="198" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">ter.</text>
          <text x="360" y="198" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">qua.</text>
          <text x="420" y="198" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">qui.</text>
          <text x="480" y="198" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">sex.</text>
        </g>
      </g>

      <!-- CANAIS DE VENDA BOTTOM PANEL -->
      <g transform="translate(380, 400)">
        <rect width="544" height="100" rx="16" fill="#ffffff" filter="url(#shadow-card-gestao)" stroke="#e2e8f0"/>
        <text x="20" y="28" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13">Canais de Venda (Mês Atual)</text>

        <circle cx="270" cy="60" r="4" fill="#10b981"/>
        <text x="280" y="64" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">iFood</text>
        <text x="440" y="64" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12">R$ 125,80 (28%)</text>
      </g>
    </g>
  </g>
</svg>
