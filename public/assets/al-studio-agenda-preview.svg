<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-agenda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#31104b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-agenda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bg-agenda)"/>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="760" height="460" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="20" y="20" width="760" height="48" rx="16" fill="#0f172a"/>
  <circle cx="50" cy="44" r="6" fill="#ef4444"/>
  <circle cx="70" cy="44" r="6" fill="#f59e0b"/>
  <circle cx="90" cy="44" r="6" fill="#10b981"/>
  <text x="120" y="49" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14">AL Studio Agenda • Agendamento &amp; Clientes</text>
  <rect x="680" y="32" width="80" height="24" rx="12" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
  <text x="720" y="48" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">OFFLINE PWA</text>

  <!-- Calendar Day Bar -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="720" height="60" rx="12" fill="url(#card-agenda)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="36" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800">Hoje, Sexta-Feira</text>
    <text x="160" y="36" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">• 8 Agendamentos Confirmados</text>

    <!-- Day Buttons -->
    <rect x="420" y="12" width="55" height="36" rx="8" fill="#334155"/>
    <text x="447" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Qua 19</text>

    <rect x="485" y="12" width="55" height="36" rx="8" fill="#334155"/>
    <text x="512" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Qui 20</text>

    <rect x="550" y="12" width="60" height="36" rx="8" fill="url(#purple-grad)"/>
    <text x="580" y="34" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Sex 21</text>

    <rect x="620" y="12" width="55" height="36" rx="8" fill="#334155"/>
    <text x="647" y="34" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sáb 22</text>
  </g>

  <!-- Schedule Slots List -->
  <g transform="translate(40, 160)">
    <!-- Slot 1 -->
    <rect x="0" y="0" width="720" height="65" rx="12" fill="url(#card-agenda)" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="70" height="35" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1"/>
    <text x="50" y="37" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">09:00</text>

    <text x="105" y="32" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">João Pedro Silva</text>
    <text x="105" y="50" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Corte &amp; Barba Completa • Prof. Carlos</text>

    <rect x="580" y="18" width="120" height="28" rx="14" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="640" y="36" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ CONFIRMADO</text>

    <!-- Slot 2 -->
    <rect x="0" y="75" width="720" height="65" rx="12" fill="url(#card-agenda)" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="90" width="70" height="35" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="50" y="112" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">10:30</text>

    <text x="105" y="107" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Mariana Costa</text>
    <text x="105" y="125" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Coloração &amp; Hidratação • Prof. Fernanda</text>

    <rect x="580" y="93" width="120" height="28" rx="14" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="640" y="111" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">EM ANDAMENTO</text>

    <!-- Slot 3 -->
    <rect x="0" y="150" width="720" height="65" rx="12" fill="url(#card-agenda)" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="165" width="70" height="35" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="50" y="187" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">14:00</text>

    <text x="105" y="182" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Lucas Santos</text>
    <text x="105" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Avaliação de Treino Personalizado</text>

    <rect x="580" y="168" width="120" height="28" rx="14" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
    <text x="640" y="186" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PENDENTE</text>

    <!-- Bottom Info Bar -->
    <rect x="0" y="225" width="720" height="35" rx="8" fill="#0f172a"/>
    <text x="360" y="247" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Organize Clientes, Serviços, Horários e Profissionais sem Mensalidades</text>
  </g>
</svg>
